name: CI

# Keeps the "green" claim in the README honest: both apps are typechecked,
# linted and built, and the backend additionally proves its schema, RLS
# scoping and all 17 contract endpoints against a real Postgres.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Node 22: supabase-js 2.117+ declares engines.node >= 22.
#
# NPM_VERSION must be EXACTLY the npm that generates the committed
# package-lock.json files (the maintainer's machine — check `npm -v`).
# Lock validation differs across npm versions: npm 10 prunes the optional
# @emnapi wasm32 deps npm 11 records, and npm 12 rejects npm-11 locks —
# both make `npm ci` fail with EUSAGE. A floating major (npm@11) also
# broke when a newer 11.x tightened validation. Pin the exact version and
# bump it only together with a regenerated lockfile.
env:
  NODE_VERSION: "22"
  NPM_VERSION: "11.6.2"

# A superseded run on the same ref teaches nobody anything — cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend — typecheck · lint · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm must match the generator of the lockfile — see NPM_VERSION note above.
      - name: Pin npm to the lockfile-generating version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build (production)
        run: npm run build
        env:
          # NEXT_PUBLIC_* are inlined at build time. This artefact is never
          # deployed (the host supplies real values), so a placeholder is
          # enough to make the build deterministic.
          NEXT_PUBLIC_API_URL: http://localhost:4000
          # Deliberately NOT enabled: a production build must not fall back to
          # the offline demo store. See shouldUseDemoFallback().
          NEXT_PUBLIC_ENABLE_DEMO_FALLBACK: "false"

  backend:
    name: Backend — typecheck · schema · contract smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    # A real Postgres, not a mock. Started via `docker run` rather than a
    # `services:` block because logical decoding needs `-c wal_level=logical`,
    # and `services:` cannot override the container command.
    #
    # 001_init.sql creates the anon/authenticated/service_role stubs when they
    # are missing, which is exactly why the whole schema is testable on a bare
    # Postgres with no Supabase account.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      CLIENT_URL: http://localhost:3000
      # Any PIN works: the seed stores the *name* of the env var, not the
      # value, and this secret must never be the real one.
      STAFF_PIN: "000000"
      # env.ts hard-requires a second PIN for the admin console; without it
      # `npm start` exits(1) before binding a port and the smoke step below
      # would be hitting a server that never came up.
      ADMIN_PIN: "654321"
      KDS_TOKEN_SECRET: ci-only-secret-not-used-anywhere-else
      # Left unset on purpose: without SUPABASE_JWT_SECRET the app runs
      # REST-only and realtime_token is null — the documented degraded mode.

    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres 17 with logical decoding
        working-directory: .
        run: |
          docker run -d --name pg \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            postgres:17 -c wal_level=logical

          for i in $(seq 1 30); do
            if docker exec pg pg_isready -U postgres >/dev/null 2>&1; then
              echo "postgres ready"
              exit 0
            fi
            sleep 2
          done

          echo "::error::postgres never became ready"
          docker logs pg
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # npm must match the generator of the lockfile — see NPM_VERSION note above.
      - name: Pin npm to the lockfile-generating version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      # Fails when a variable env.ts hard-requires at boot is not declared in
      # the root render.yaml — the drift that makes the Render service
      # exit(1) on every restart. Needs no dependencies, so it runs first.
      - name: Render Blueprint declares every boot-required env var
        run: npm run check:render-env

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Apply schema, Realtime wiring and seed
        run: npm run db:setup

      - name: Verify schema, RLS scoping, indexes and privileges
        run: npm run db:verify

      - name: Contract smoke against a live server
        run: |
          npm start > /tmp/api.log 2>&1 &
          API_PID=$!

          for i in $(seq 1 40); do
            if curl -sf -m 2 http://localhost:4000/api/v1/health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          set +e
          npm run smoke
          RC=$?
          set -e

          kill "$API_PID" 2>/dev/null || true
          echo "--- API server log ---"
          cat /tmp/api.log
          exit $RC

  # The floor screen is the one surface where compiling proves nothing: it is
  # PIN-gated, needs a staff bearer token, and its entire value is rendering
  # live E17 data. This drives real headless Chrome over the DevTools protocol
  # and asserts what a person would see.
  e2e:
    name: E2E — floor view in a real browser
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      CLIENT_URL: http://localhost:3000
      STAFF_PIN: "000000"
      ADMIN_PIN: "654321"
      KDS_TOKEN_SECRET: ci-only-secret-not-used-anywhere-else
      NEXT_PUBLIC_API_URL: http://localhost:4000
      # Force the live path: the demo fallback is on by default in a dev
      # server, and this job must fail if the board silently serves seed data.
      NEXT_PUBLIC_ENABLE_DEMO_FALLBACK: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres 17 with logical decoding
        working-directory: .
        run: |
          docker run -d --name pg \
            -e POSTGRES_PASSWORD=postgres \
            -p 5432:5432 \
            postgres:17 -c wal_level=logical

          for i in $(seq 1 30); do
            if docker exec pg pg_isready -U postgres >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::postgres never became ready"
          docker logs pg
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # npm must match the generator of the lockfile — see NPM_VERSION note above.
      - name: Pin npm to the lockfile-generating version
        run: npm install -g npm@${{ env.NPM_VERSION }}

      - name: Locate Chrome
        run: |
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then
              echo "CHROME_PATH=$(command -v $c)" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::no Chrome binary found on the runner"
          exit 1

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Apply schema, Realtime wiring and seed
        working-directory: backend
        run: npm run db:setup

      - name: Build the API
        working-directory: backend
        run: npm run build

      - name: Floor view end-to-end
        working-directory: frontend
        run: |
          (cd ../backend && npm start > /tmp/api.log 2>&1) &
          API_PID=$!
          npm run dev > /tmp/web.log 2>&1 &
          WEB_PID=$!

          for i in $(seq 1 60); do
            curl -sf -m 2 http://localhost:4000/api/v1/health >/dev/null 2>&1 && \
            curl -sf -m 2 http://localhost:3000/ >/dev/null 2>&1 && break
            sleep 1
          done

          set +e
          npm run check:floor
          RC=$?
          set -e

          kill "$API_PID" "$WEB_PID" 2>/dev/null || true
          echo "--- API log ---"; tail -20 /tmp/api.log
          echo "--- web log ---"; tail -20 /tmp/web.log
          exit $RC
